[project]
name = "psych-bot"
version = "0.1.0"
description = "Terminalowy edukacyjny symulator wywiadu klinicznego dla psychologów i studentów."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Project Author" }
]
keywords = [
    "psychology",
    "clinical-interview",
    "education",
    "icd-11",
    "simulation",
    "terminal-bot"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Typing :: Typed",
]

dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "nicegui>=3.12.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
psych-bot = "psych_bot.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "ANN",
    "D",
]
ignore = [
    "D100",
    "D104",
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D",
    "ANN",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = [
    "psych_bot",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
